<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clothing Store — Магазин одежды</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">Clothing Store</h1>
      <nav class="nav">
        <a href="#">Главная</a>
        <a href="#catalog">Каталог</a>
        <a href="#contact">Контакты</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Новая коллекция — стиль и качество</h2>
      <p>Быстрая доставка и возврат.</p>
    </section>

    <section id="catalog">
      <h2>Каталог</h2>
      <div id="products" class="products-grid">
        <!-- карточки товаров будут подгружаться скриптом -->
      </div>
    </section>

    <section id="contact">
      <h2>Контакты</h2>
      <p>Напишите нам: example@store.com</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2025 Clothing Store — Командный проект</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
